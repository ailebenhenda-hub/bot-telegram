<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDF Running Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 20px; }
        .item-card {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info strong { font-size: 15px; }
        .item-info small { color: var(--tg-theme-hint-color, #777); }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔥 IDF Running Shop</h1>
    <div id="catalog-list">
        </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ouvre la Web App en plein écran

        // Liste des articles disponibles (simulée ou récupérée)
        const items = [
            { id: "1", name: "Pantalon Nike Trail", size: "S", price: 60 },
            { id: "2", name: "Pantalon Nike Aeroswift", size: "M", price: 75 },
            { id: "3", name: "Pantalon Nike Phenom Elite", size: "L", price: 90 },
            { id: "4", name: "Sweat Nike Tech Aviateur v1", size: "M", price: 60 }
        ];

        const container = document.getElementById('catalog-list');
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-info">
                    <strong>#${item.id} - ${item.name}</strong><br>
                    <small>Taille : ${item.size} | 💰 ${item.price} €</small>
                </div>
                <button onclick="addToCart('${item.id}')">Ajouter</button>
            `;
            container.appendChild(card);
        });

        function addToCart(itemId) {
            // Envoie les données au bot Telegram
            tg.sendData(JSON.stringify({ action: "add_cart", item_id: itemId }));
            tg.close(); // Ferme automatiquement la Web App après l'action
        }
    </script>
</body>
</html>
