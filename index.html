<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDF Running Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: rgba(20, 20, 20, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --secondary-text: #8e8e93;
            --success: #34c759;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 14px; padding-bottom: 120px; }
        header { text-align: center; margin-bottom: 15px; padding-top: 10px; }
        h1 { font-size: 24px; font-weight: 900; margin: 0 0 4px 0; background: linear-gradient(180deg, #ffffff 0%, #bbbbbb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--secondary-text); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .search-box { width: 100%; padding: 13px 16px; background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; color: white; font-size: 14px; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .filter-chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
        .chip { background-color: var(--card-bg); border: 1px solid var(--card-border); color: var(--secondary-text); padding: 7px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .chip.active { background-color: #ffffff; color: #000000; }
        .item-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .item-card h3 { font-size: 14px; margin: 0 0 6px 0; }
        .badge { background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--secondary-text); }
        .item-price { font-weight: 900; font-size: 16px; margin-top: 8px; }
        .add-btn { background-color: #ffffff; color: #000000; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .footer-cart { position: fixed; bottom: 0; left: 0; right: 0; background-color: rgba(8, 8, 8, 0.9); backdrop-filter: blur(20px); border-top: 1px solid var(--card-border); padding: 14px 16px; z-index: 100; display: none; }
        .checkout-btn { background-color: #ffffff; color: #000000; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; }
        .cart-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; flex-direction: column; justify-content: flex-end; }
        .cart-content { background: #141416; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px; max-height: 80vh; overflow-y: auto; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 8px; }
        .validate-order-btn { background-color: var(--success); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header><h1>IDF RUNNING SHOP</h1><p class="subtitle">Gestion des stocks en temps réel</p></header>
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Rechercher..." oninput="renderCatalog()">
    <div class="filter-chips">
        <div class="chip active" onclick="setFilter('ALL', this)">Tout</div>
        <div class="chip" onclick="setFilter('S', this)">S</div>
        <div class="chip" onclick="setFilter('M', this)">M</div>
        <div class="chip" onclick="setFilter('L', this)">L</div>
    </div>
    <div id="catalog-container"></div>
    <div class="footer-cart" id="footer-cart-bar">
        <button class="checkout-btn" onclick="openCartModal()">
            <span id="cart-count-label">🛒 Panier</span>
            <span id="cart-total-preview">0 €</span>
        </button>
    </div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div style="display:flex; justify-content:space-between;"><h2>Mon Panier</h2><button onclick="closeCartModal()" style="background:none;border:none;color:white;font-size:20px;">✕</button></div>
            <div id="cartItemsList"></div>
            <button class="validate-order-btn" onclick="sendOrderToBot()">✨ Valider et commander</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let products = [
            { id: 1, name: "Pantalon Nike Trail", taille: "S", etat: "8/10", prix: 60, stock: 1 },
            { id: 2, name: "Pantalon Nike Aeroswift", taille: "M", etat: "Excellent", prix: 75, stock: 1 },
            { id: 3, name: "Pantalon Nike Phenom Elite", taille: "S", etat: "Excellent", prix: 90, stock: 1 },
            { id: 4, name: "Sweat Nike Tech Aviateur v1", taille: "M", etat: "Excellent", prix: 60, stock: 1 },
            { id: 5, name: "Pantalon Nike Phenom Elite (Gris)", taille: "L", etat: "Excellent", prix: 90, stock: 1 },
            { id: 6, name: "Tee-Shirt Nike Trail", taille: "S", etat: "Excellent", prix: 40, stock: 1 },
            { id: 7, name: "Tee-Shirt Nike Running Division", taille: "M", etat: "Excellent", prix: 35, stock: 1 },
            { id: 8, name: "Tee-Shirt Nike Dri-Fit (Rouge)", taille: "S", etat: "Excellent", prix: 30, stock: 1 },
            { id: 9, name: "Sweat Nike Tech Fleece (Noir)", taille: "S", etat: "Excellent", prix: 70, stock: 1 },
            { id: 10, name: "Pantalon Nike Phenom Elite Poche Noir", taille: "S", etat: "8/10", prix: 80, stock: 1 }
        ];

        let cart = {};
        let currentSize = 'ALL';

        function renderCatalog() {
            const container = document.getElementById("catalog-container");
            const query = document.getElementById("search-input").value.toLowerCase();
            container.innerHTML = "";
            
            let filtered = products.filter(p => (currentSize === 'ALL' || p.taille === currentSize) && p.name.toLowerCase().includes(query));
            
            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="item-card">
                        <div>
                            <h3>#${item.id} - ${item.name}</h3>
                            <span class="badge">${item.taille}</span> <span class="badge">${item.etat}</span> <span class="badge">Stock: ${item.stock}</span>
                            <div class="item-price">${item.prix} €</div>
                        </div>
                        <button class="add-btn" onclick="addToCart('${item.id}')">Ajouter</button>
                    </div>`;
            });
        }

        function setFilter(size, el) { 
            currentSize = size; 
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); 
            el.classList.add('active'); 
            renderCatalog(); 
        }

        function addToCart(id) { 
            cart[id] = (cart[id] || 0) + 1; 
            updateCartUI(); 
        }

        function updateCartUI() {
            let total = Object.values(cart).reduce((a, b) => a + b, 0);
            let totalPrice = Object.keys(cart).reduce((sum, id) => {
                let p = products.find(x => String(x.id) === String(id));
                return sum + (p.prix * cart[id]);
            }, 0);

            document.getElementById("footer-cart-bar").style.display = total > 0 ? "block" : "none";
            document.getElementById("cart-count-label").textContent = `🛒 ${total} article(s)`;
            document.getElementById("cart-total-preview").textContent = `${totalPrice} €`;
        }

        function openCartModal() {
            const list = document.getElementById("cartItemsList"); 
            list.innerHTML = "";
            for (let id in cart) {
                let p = products.find(x => String(x.id) === String(id));
                list.innerHTML += `<div class="cart-item-row"><span>${cart[id]}x ${p.name}</span><strong>${p.prix * cart[id]} €</strong></div>`;
            }
            document.getElementById("cartModal").style.display = "flex";
        }

        function closeCartModal() { 
            document.getElementById("cartModal").style.display = "none"; 
        }

        function sendOrderToBot() {
            alert("Commande validée avec succès !"); 
            cart = {}; 
            updateCartUI(); 
            closeCartModal();
        }

        // Lancement direct de l'affichage
        renderCatalog();
    </script>
</body>
</html>
