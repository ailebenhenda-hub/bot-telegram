<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDF Running Shop</title>
    <!-- Chargement de la police Inter pour un style plus moderne et léché -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: rgba(20, 20, 20, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --secondary-text: #8e8e93;
            --success: #00ff66; /* Vert électrique plus dynamique */
            --danger: #ff453a;
            --accent-glow: rgba(0, 255, 102, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 120px;
        }

        header {
            text-align: center;
            margin-bottom: 18px;
            padding-top: 10px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        h1 span {
            color: var(--success);
        }

        p.subtitle {
            color: var(--secondary-text);
            font-size: 11px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .announcement-banner {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 16px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 16px;
            color: #d1d1d6;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--success);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 18px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--secondary-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip.active {
            background-color: var(--success);
            color: #000000;
            border-color: var(--success);
            font-weight: 700;
        }

        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .item-card:active {
            transform: scale(0.98);
        }

        .item-info { flex-grow: 1; padding-right: 12px; }
        .item-info h3 { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; letter-spacing: -0.2px; }
        
        .item-meta {
            display: flex;
            gap: 6px;
            font-size: 11px;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }

        .badge { background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 6px; color: #d1d1d6; font-weight: 500; }
        .item-price { font-weight: 800; font-size: 16px; color: #ffffff; }

        @keyframes popClick {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .add-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .add-btn.pop-anim { animation: popClick 0.3s ease-in-out; }
        .add-btn.added { background-color: var(--success); color: #000000; }
        
        .add-btn.sold-out {
            background-color: rgba(255,255,255,0.05);
            color: var(--secondary-text);
            cursor: not-allowed;
        }

        .footer-cart {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 14px 16px;
            z-index: 100;
            display: none;
        }

        .checkout-btn {
            background-color: var(--success);
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .cart-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
        }

        .cart-content {
            background-color: #141416;
            border-top: 1px solid var(--card-border);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .cart-header h2 { font-size: 18px; font-weight: 800; margin: 0; }
        .close-cart { background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .cart-items-list { overflow-y: auto; max-height: 25vh; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 12px; font-size: 13px; border: 1px solid var(--card-border); }
        .remove-item { color: var(--danger); background: none; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }

        .shipping-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 15px;
        }
        .shipping-section label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #d1d1d6;
        }
        .shipping-select {
            width: 100%;
            background: #1c1c1e;
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }

        .cart-summary { border-top: 1px solid var(--card-border); padding-top: 14px; margin-bottom: 16px; font-size: 13px; color: var(--secondary-text); display: flex; flex-direction: column; gap: 8px; }
        .summary-row { display: flex; justify-content: space-between; }
        .summary-row.total { color: white; font-weight: 900; font-size: 16px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 10px; }

        .validate-order-btn { background-color: var(--success); color: #000000; border: none; width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; text-align: center; box-shadow: 0 4px 20px var(--accent-glow); }
        .no-result { text-align: center; color: var(--secondary-text); font-size: 13px; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>IDF <span>RUNNING SHOP</span></h1>
        <p class="subtitle">Streetwear & Vêtements Running</p>
    </header>

    <div class="announcement-banner">
        📢 <strong>Annonce :</strong> Restock de runnings en fin de mois ! Y'aura du trail, du tech et du phenom.
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 Rechercher un article..." oninput="filterCatalog()">

    <div class="filter-chips">
        <div class="chip active" onclick="setFilter('ALL', this)">Tout</div>
        <div class="chip" onclick="setFilter('S', this)">Taille S</div>
        <div class="chip" onclick="setFilter('M', this)">Taille M</div>
        <div class="chip" onclick="setFilter('L', this)">Taille L</div>
        <div class="chip" onclick="setFilter('XL', this)">Taille XL</div>
    </div>

    <div class="catalog-grid" id="catalog-container"></div>

    <div class="footer-cart" id="footer-cart-bar">
        <button class="checkout-btn" onclick="openCartModal()">
            <span id="cart-count-label">🛒 0 article(s)</span>
            <span id="cart-total-preview">0 € &rarr; Voir le panier</span>
        </button>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content" id="cartContentArea"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = "https://jzurawtfxwyinwzowpkx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_OXqEOCgFVL4qbZUHK7DaKg_o6BzN8rK";

        const BOT_TOKEN = "8537469629:AAHqv5VPN1Qm6zJMiiHIHlSSY-eNPQOEX3bo";
        const ADMIN_GROUP_ID = "-1003956183527";
        const REVOLUT_BASE = "https://revolut.me/shvppeur_corp";

        let items = [];
        let currentSize = 'ALL';
        let cart = [];
        let selectedShippingMethod = 'colissimo';

        async function fetchCatalog() {
            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/catalog?select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (response.ok) {
                    let data = await response.json();
                    // Conversion des données Supabase au format attendu par la WebApp
                    items = data.map(r => ({
                        id: String(r.item_id || r.id),
                        name: r.name,
                        taille: r.taille || "U",
                        etat: r.etat || "Bon état",
                        prix: Number(r.prix || 0),
                        poids: Number(r.poids || 250),
                        available: r.available === 1 || r.available === true
                    }));
                }
            } catch (e) {
                console.error("Erreur chargement catalogue Supabase", e);
            }
            renderCatalog();
        }

        function renderCatalog(filterText = '') {
            const container = document.getElementById("catalog-container");
            container.innerHTML = "";

            const filtered = items.filter(item => {
                const matchesSize = currentSize === 'ALL' || (item.taille && item.taille.toUpperCase() === currentSize.toUpperCase());
                const matchesSearch = item.name.toLowerCase().includes(filterText.toLowerCase()) || item.id.includes(filterText);
                return matchesSize && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-result">Aucun article trouvé 😕</div>`;
                return;
            }

            filtered.forEach(item => {
                const isSoldOut = !item.available;
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div class="item-info">
                        <h3>#${item.id} - ${item.name}</h3>
                        <div class="item-meta">
                            <span class="badge">Taille ${item.taille}</span>
                            <span class="badge">${item.etat}</span>
                        </div>
                        <div class="item-price">${item.prix} €</div>
                    </div>
                    ${isSoldOut 
                        ? `<button class="add-btn sold-out" disabled>Épuisé</button>` 
                        : `<button class="add-btn" id="btn-${item.id}" onclick="addToCart('${item.id}', this)">Ajouter</button>`
                    }
                `;
                container.appendChild(card);
            });
        }

        function setFilter(size, element) {
            currentSize = size;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderCatalog(document.getElementById('search-input').value);
        }

        function filterCatalog() {
            renderCatalog(document.getElementById('search-input').value);
        }

        function addToCart(itemId, btn) {
            if (cart.includes(itemId)) {
                alert("Cet article est déjà dans ton panier !");
                return;
            }

            cart.push(itemId);
            updateCartUI();

            btn.classList.add("pop-anim");
            btn.textContent = "✓ Ajouté";
            btn.classList.add("added");

            setTimeout(() => { btn.classList.remove("pop-anim"); }, 300);
            setTimeout(() => { btn.textContent = "Ajouter"; btn.classList.remove("added"); }, 1000);

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            if (cart.length === 0) closeCartModal();
            else openCartModal();
        }

        function updateCartUI() {
            const footerBar = document.getElementById("footer-cart-bar");
            if (cart.length > 0) {
                footerBar.style.display = "block";
                document.getElementById("cart-count-label").textContent = `🛒 ${cart.length} article(s)`;
                let calc = calculateTotals();
                document.getElementById("cart-total-preview").textContent = `${calc.finalTotal} € ➔ Panier`;
            } else {
                footerBar.style.display = "none";
            }
        }

        function calculateColissimoShipping(totalWeightGrams, totalPrice) {
            if (totalPrice >= 170) return 0;
            if (totalWeightGrams <= 250) return 5.49;
            if (totalWeightGrams <= 500) return 7.59;
            if (totalWeightGrams <= 750) return 9.29;
            if (totalWeightGrams <= 1000) return 9.59;
            if (totalWeightGrams <= 2000) return 11.19;
            if (totalWeightGrams <= 5000) return 17.39;
            if (totalWeightGrams <= 10000) return 25.29;
            if (totalWeightGrams <= 15000) return 31.99;
            return 39.59;
        }

        function calculateTotals() {
            let subtotal = 0;
            let totalWeight = 0;
            cart.forEach(id => {
                let item = items.find(i => i.id === id);
                if (item) {
                    subtotal += item.prix;
                    totalWeight += (item.poids || 250);
                }
            });
            
            let discount = 0;
            if (cart.length === 2 && subtotal > 70) discount = 5;
            else if (cart.length === 3 && subtotal > 90) discount = 10;
            else if (cart.length === 4 && subtotal > 110) discount = 15;
            else if (cart.length >= 5 && subtotal > 130) discount = 20;

            let shipping = 0;
            if (selectedShippingMethod === 'colissimo') {
                shipping = calculateColissimoShipping(totalWeight, subtotal);
            } else if (selectedShippingMethod === 'gare_5') {
                shipping = 5;
            } else if (selectedShippingMethod === 'gare_10') {
                shipping = 10;
            } else if (selectedShippingMethod === 'gare_15') {
                shipping = 15;
            }

            let finalTotal = subtotal - discount + shipping;
            if (finalTotal < 0) finalTotal = 0;
            return { subtotal, discount, shipping, finalTotal };
        }

        function updateShippingChoice(selectEl) {
            selectedShippingMethod = selectEl.value;
            refreshCartSummary();
        }

        function openCartModal() {
            const contentArea = document.getElementById("cartContentArea");
            contentArea.innerHTML = `
                <div class="cart-header">
                    <h2>Mon Panier</h2>
                    <button class="close-cart" onclick="closeCartModal()">&times;</button>
                </div>
                <div class="cart-items-list" id="cartItemsList"></div>
                
                <div class="shipping-section">
                    <label for="shippingSelect">📦 Mode de livraison :</label>
                    <select id="shippingSelect" class="shipping-select" onchange="updateShippingChoice(this)">
                        <option value="colissimo" ${selectedShippingMethod === 'colissimo' ? 'selected' : ''}>Colissimo (Calcul au poids / Gratuit dès 170€)</option>
                        <option value="gare_5" ${selectedShippingMethod === 'gare_5' ? 'selected' : ''}>Mains propres - Gare IDF (Proche : 5€)</option>
                        <option value="gare_10" ${selectedShippingMethod === 'gare_10' ? 'selected' : ''}>Mains propres - Gare IDF (Moyenne distance : 10€)</option>
                        <option value="gare_15" ${selectedShippingMethod === 'gare_15' ? 'selected' : ''}>Mains propres - Gare IDF (Longue distance : 15€)</option>
                    </select>
                </div>

                <div class="cart-summary">
                    <div class="summary-row"><span>Sous-total :</span><span id="subtotalAmount">0 €</span></div>
                    <div class="summary-row"><span>Remise lot :</span><span id="discountAmount" style="color: var(--success);">-0 €</span></div>
                    <div class="summary-row"><span>Frais de port :</span><span id="shippingAmount">0 €</span></div>
                    <div class="summary-row total"><span>Total à régler :</span><span id="finalTotalAmount">0 €</span></div>
                </div>
                <button class="validate-order-btn" onclick="sendOrderToBot()">✨ Valider et commander</button>
            `;

            const listEl = document.getElementById("cartItemsList");
            cart.forEach((id, index) => {
                let item = items.find(i => i.id === id);
                if (item) {
                    const row = document.createElement("div");
                    row.className = "cart-item-row";
                    row.innerHTML = `
                        <span>#${item.id} - ${item.name} (${item.taille})</span>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <strong>${item.prix} €</strong>
                            <button class="remove-item" onclick="removeFromCart(${index})">&times;</button>
                        </div>
                    `;
                    listEl.appendChild(row);
                }
            });
            refreshCartSummary();
            document.getElementById("cartModal").style.display = "flex";
        }

        function refreshCartSummary() {
            let calc = calculateTotals();
            document.getElementById("subtotalAmount").textContent = calc.subtotal + " €";
            document.getElementById("discountAmount").textContent = "-" + calc.discount + " €";
            
            let shippingLabel = calc.shipping + " €";
            if (selectedShippingMethod === 'colissimo' && calc.shipping === 0) {
                shippingLabel = "Offert 🎉 (Dès 170€)";
            }
            document.getElementById("shippingAmount").textContent = shippingLabel;
            document.getElementById("finalTotalAmount").textContent = calc.finalTotal + " €";
        }

        function closeCartModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        async function sendOrderToBot() {
            if (cart.length === 0) return;

            const user = tg.initDataUnsafe?.user;
            const username = user?.username ? `@${user.username}` : (user?.first_name || "Client WebApp");
            const telegramId = user?.id ? Number(user.id) : 0;
            const calc = calculateTotals();
            
            let itemsSummary = cart.map(id => {
                let itm = items.find(i => i.id === id);
                return `#${id} ${itm ? itm.name : ''} (${itm ? itm.taille : ''})`;
            }).join(', ');

            let shippingTextLabel = "Colissimo";
            if (selectedShippingMethod === 'gare_5') shippingTextLabel = "Mains propres (Proche - 5€)";
            else if (selectedShippingMethod === 'gare_10') shippingTextLabel = "Mains propres (Moyenne - 10€)";
            else if (selectedShippingMethod === 'gare_15') shippingTextLabel = "Mains propres (Loin - 15€)";

            const orderData = {
                items: cart.join(', '),
                items_summary: itemsSummary,
                username: username,
                telegram_id: telegramId,
                total_amount: calc.finalTotal,
                shipping: shippingTextLabel,
                statut: "nouveau"
            };

            try {
                // Enregistrement de la commande dans Supabase
                let response = await fetch(`${SUPABASE_URL}/rest/v1/commandes`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    // Mettre à jour la disponibilité des articles commandés dans le catalogue Supabase (available = 0)
                    for (let id of cart) {
                        await fetch(`${SUPABASE_URL}/rest/v1/catalog?item_id=eq.${id}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ available: 0 })
                        });
                    }

                    try {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: ADMIN_GROUP_ID,
                                text: `🚨 NOUVELLE COMMANDE (WEB APP)\n👤 Client : ${username}\n📦 Articles : ${itemsSummary}\n🚚 Livraison : ${shippingTextLabel}\n💰 Montant : ${calc.finalTotal} €`,
                                parse_mode: "Markdown"
                            })
                        });
                    } catch (tgErr) {
                        console.log("Erreur notif Telegram", tgErr);
                    }

                    const revolutUrl = `${REVOLUT_BASE}/${calc.finalTotal}`;
                    
                    const contentArea = document.getElementById("cartContentArea");
                    contentArea.innerHTML = `
                        <div class="cart-header">
                            <h2>Paiement</h2>
                            <button class="close-cart" onclick="closeCartModal()">&times;</button>
                        </div>
                        <div style="text-align: center; padding: 10px 0; display: flex; flex-direction: column; gap: 8px;">
                            <div style="font-size: 32px;">⭐️</div>
                            <h3 style="margin: 0; font-size: 15px; color: #ffffff;">Commande enregistrée !</h3>
                            <p style="color: var(--secondary-text); font-size: 11px; margin: 0; line-height: 1.4;">
                                Clique sur le bouton ci-dessous pour régler tes <strong>${calc.finalTotal} €</strong> sur Revolut. 
                                Une fois payé, <strong>envoie-moi le screenshot du reçu</strong> dans la discussion Telegram !
                            </p>
                        </div>
                        <a href="${revolutUrl}" target="_blank" class="validate-order-btn" style="text-decoration: none; display: block; box-sizing: border-box; text-align: center; margin-bottom: 10px;">💳 Payer ${calc.finalTotal} € sur Revolut</a>
                        <button class="validate-order-btn" style="background-color: #2c2c2e; color: #ffffff;" onclick="closeCartModal()">🏠 Retour à la boutique</button>
                    `;

                    cart = [];
                    updateCartUI();
                    fetchCatalog(); // Recharger le catalogue pour griser les articles achetés

                } else {
                    let errorData = await response.json();
                    console.error("Erreur Supabase :", errorData);
                    alert("Erreur : " + (errorData.message || "Impossible d'envoyer la commande."));
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Erreur de connexion.");
            }
        }

        // Lancer le chargement du catalogue au démarrage de la Web App
        fetchCatalog();
    </script>
