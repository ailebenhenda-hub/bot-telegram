<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDF Running Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --text-color: #ffffff;
            --secondary-text: #888888;
            --accent: #ffffff;
            --border-color: #222222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-bottom: 95px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-top: 5px;
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 3px 0;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: var(--secondary-text);
            font-size: 11px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .banner {
            background: linear-gradient(135deg, #181818, #111111);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 15px;
            color: #d0d0d0;
            line-height: 1.4;
        }

        /* Barre de recherche et filtres */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box:focus {
            border-color: #555;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .filter-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--secondary-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip.active {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Grille catalogue */
        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            flex-grow: 1;
            padding-right: 10px;
        }

        .item-info h3 {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: #f0f0f0;
        }

        .item-meta {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: var(--secondary-text);
            margin-bottom: 6px;
        }

        .badge {
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ccc;
        }

        .item-price {
            font-weight: 900;
            font-size: 16px;
            color: #ffffff;
        }

        .add-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        .add-btn.added {
            background-color: #27ae60;
            color: #ffffff;
        }

        /* Panier fixe en bas */
        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(11, 11, 11, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            padding: 12px 15px;
            text-align: center;
            z-index: 100;
        }

        .checkout-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,255,255,0.08);
        }

        .no-result {
            text-align: center;
            color: var(--secondary-text);
            font-size: 13px;
            padding: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>IDF RUNNING SHOP</h1>
        <p class="subtitle">Streetwear & Vêtements Running</p>
    </header>

    <div class="banner">
        🔥 <strong>Port offert</strong> dès 170 € d'achat !<br>Remise de <strong>-5€</strong> par article supp. dès 70€.
    </div>

    <!-- Barre de recherche -->
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Rechercher un article (ex: Trail, Aeroswift...)" oninput="filterCatalog()">

    <!-- Filtres par taille -->
    <div class="filter-chips">
        <div class="chip active" onclick="setFilter('ALL', this)">Tout</div>
        <div class="chip" onclick="setFilter('S', this)">Taille S</div>
        <div class="chip" onclick="setFilter('M', this)">Taille M</div>
        <div class="chip" onclick="setFilter('L', this)">Taille L</div>
        <div class="chip" onclick="setFilter('XL', this)">Taille XL</div>
    </div>

    <div class="catalog-grid" id="catalog-container">
        <!-- Généré dynamiquement -->
    </div>

    <div class="footer-cart">
        <button class="checkout-btn" onclick="openBotCart()">🛒 Voir mon panier / Gérer via le Bot</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const items = [
            { id: "1", name: "Pantalon Nike Trail", taille: "S", etat: "8/10", prix: 60 },
            { id: "2", name: "Pantalon Nike Aeroswift", taille: "M", etat: "Excellent", prix: 75 },
            { id: "3", name: "Pantalon Nike Phenom Elite", taille: "L", etat: "Excellent", prix: 90 },
            { id: "4", name: "Sweat Nike Tech Aviateur v1", taille: "M", etat: "Excellent", prix: 60 },
            { id: "5", name: "Pantalon Nike Phenom Elite (Gris)", taille: "L", etat: "Excellent", prix: 90 },
            { id: "6", name: "Tee-Shirt Nike Trail", taille: "S", etat: "Excellent", prix: 40 },
            { id: "7", name: "Tee-Shirt Nike Running Division", taille: "M", etat: "Excellent", prix: 35 },
            { id: "8", name: "Tee-Shirt Nike Dri-Fit (Rouge)", taille: "S", etat: "Excellent", prix: 30 },
            { id: "9", name: "Sweat Nike Tech Fleece (Noir)", taille: "S", etat: "Excellent", prix: 70 },
            { id: "10", name: "Pantalon Nike Phenom Elite Poche Noir", taille: "S", etat: "8/10", prix: 80 }
        ];

        let currentSize = 'ALL';

        function renderCatalog(filterText = '') {
            const container = document.getElementById("catalog-container");
            container.innerHTML = "";

            const filtered = items.filter(item => {
                const matchesSize = currentSize === 'ALL' || item.taille === currentSize;
                const matchesSearch = item.name.toLowerCase().includes(filterText.toLowerCase()) || item.id.includes(filterText);
                return matchesSize && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-result">Aucun article trouvé 😕</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div class="item-info">
                        <h3>#${item.id} - ${item.name}</h3>
                        <div class="item-meta">
                            <span class="badge">Taille ${item.taille}</span>
                            <span class="badge">${item.etat}</span>
                        </div>
                        <div class="item-price">${item.prix} €</div>
                    </div>
                    <button class="add-btn" id="btn-${item.id}" onclick="addToCart('${item.id}', this)">Ajouter</button>
                `;
                container.appendChild(card);
            });
        }

        function setFilter(size, element) {
            currentSize = size;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            const searchText = document.getElementById('search-input').value;
            renderCatalog(searchText);
        }

        function filterCatalog() {
            const searchText = document.getElementById('search-input').value;
            renderCatalog(searchText);
        }

        function addToCart(itemId, buttonElement) {
            tg.sendData(itemId);
            
            buttonElement.textContent = "✓ Ajouté";
            buttonElement.classList.add("added");
            
            setTimeout(() => {
                buttonElement.textContent = "Ajouter";
                buttonElement.classList.remove("added");
            }, 1000);
        }

        function openBotCart() {
            tg.close();
        }

        // Initialisation au chargement
        renderCatalog();
    </script>
</body>
</html>
