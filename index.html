<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDF Running Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: rgba(22, 22, 22, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --secondary-text: #8e8e93;
            --accent: #ffffff;
            --success: #34c759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 14px;
            padding-bottom: 110px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            padding-top: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #bbbbbb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--secondary-text);
            font-size: 11px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .banner {
            background: linear-gradient(135deg, rgba(30,30,30,0.8), rgba(15,15,15,0.9));
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-size: 12px;
            margin-bottom: 16px;
            color: #d1d1d6;
            line-height: 1.4;
        }

        /* Barre de recherche et filtres */
        .search-box {
            width: 100%;
            padding: 13px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: rgba(255,255,255,0.3);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filter-chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--secondary-text);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .chip.active {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Grille catalogue */
        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .item-info {
            flex-grow: 1;
            padding-right: 12px;
        }

        .item-info h3 {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #ffffff;
        }

        .item-meta {
            display: flex;
            gap: 6px;
            font-size: 11px;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }

        .badge {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 2px 8px;
            border-radius: 6px;
            color: #d1d1d6;
        }

        .item-price {
            font-weight: 900;
            font-size: 16px;
            color: #ffffff;
        }

        .add-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* Panier fixe en bas */
        .footer-cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 14px 16px;
            z-index: 100;
        }

        .checkout-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255,255,255,0.12);
        }

        /* Modal du Panier (Pop-up intégrée) */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            animation: fadeIn 0.2s ease-out;
        }

        .cart-content {
            background-color: #141416;
            border-top: 1px solid var(--card-border);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cart-header h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .close-cart {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 35vh;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
        }

        .remove-item {
            color: #ff453a;
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-summary {
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--secondary-text);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
        }

        .summary-row.total {
            color: white;
            font-weight: 900;
            font-size: 16px;
            margin-top: 6px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        .validate-order-btn {
            background-color: #34c759;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }

        .no-result {
            text-align: center;
            color: var(--secondary-text);
            font-size: 13px;
            padding: 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>IDF RUNNING SHOP</h1>
        <p class="subtitle">Streetwear & Vêtements Running</p>
    </header>

    <div class="banner">
        🔥 <strong>Port offert</strong> dès 170 € d'achat !<br>Remise de <strong>-5€</strong> par article supp. dès 70€.
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 Rechercher un article..." oninput="filterCatalog()">

    <div class="filter-chips">
        <div class="chip active" onclick="setFilter('ALL', this)">Tout</div>
        <div class="chip" onclick="setFilter('S', this)">Taille S</div>
        <div class="chip" onclick="setFilter('M', this)">Taille M</div>
        <div class="chip" onclick="setFilter('L', this)">Taille L</div>
        <div class="chip" onclick="setFilter('XL', this)">Taille XL</div>
    </div>

    <div class="catalog-grid" id="catalog-container">
        </div>

    <div class="footer-cart" id="footer-cart-bar" style="display: none;">
        <button class="checkout-btn" onclick="openCartModal()">
            <span id="cart-count-label">🛒 0 article(s)</span>
            <span id="cart-total-preview">0 € &rarr; Voir le panier</span>
        </button>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>Mon Panier</h2>
                <button class="close-cart" onclick="closeCartModal()">&times;</button>
            </div>
            
            <div class="cart-items-list" id="cartItemsList">
                </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>Sous-total :</span>
                    <span id="subtotalAmount">0 €</span>
                </div>
                <div class="summary-row">
                    <span>Remise ((-5€ / art. dès 70€)) :</span>
                    <span id="discountAmount" style="color: #34c759;">-0 €</span>
                </div>
                <div class="summary-row">
                    <span>Frais de port :</span>
                    <span id="shippingAmount">10 €</span>
                </div>
                <div class="summary-row total">
                    <span>Total à régler :</span>
                    <span id="finalTotalAmount">0 €</span>
                </div>
            </div>

            <button class="validate-order-btn" onclick="sendOrderToBot()">✨ Valider et commander via le Bot</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const items = [
            { id: "1", name: "Pantalon Nike Trail", taille: "S", etat: "8/10", prix: 60 },
            { id: "2", name: "Pantalon Nike Aeroswift", taille: "M", etat: "Excellent", prix: 75 },
            { id: "3", name: "Pantalon Nike Phenom Elite", taille: "L", etat: "Excellent", prix: 90 },
            { id: "4", name: "Sweat Nike Tech Aviateur v1", taille: "M", etat: "Excellent", prix: 60 },
            { id: "5", name: "Pantalon Nike Phenom Elite (Gris)", taille: "L", etat: "Excellent", prix: 90 },
            { id: "6", name: "Tee-Shirt Nike Trail", taille: "S", etat: "Excellent", prix: 40 },
            { id: "7", name: "Tee-Shirt Nike Running Division", taille: "M", etat: "Excellent", prix: 35 },
            { id: "8", name: "Tee-Shirt Nike Dri-Fit (Rouge)", taille: "S", etat: "Excellent", prix: 30 },
            { id: "9", name: "Sweat Nike Tech Fleece (Noir)", taille: "S", etat: "Excellent", prix: 70 },
            { id: "10", name: "Pantalon Nike Phenom Elite Poche Noir", taille: "S", etat: "8/10", prix: 80 }
        ];

        let currentSize = 'ALL';
        let cart = []; // Liste des IDs d'articles ajoutés

        function renderCatalog(filterText = '') {
            const container = document.getElementById("catalog-container");
            container.innerHTML = "";

            const filtered = items.filter(item => {
                const matchesSize = currentSize === 'ALL' || item.taille === currentSize;
                const matchesSearch = item.name.toLowerCase().includes(filterText.toLowerCase()) || item.id.includes(filterText);
                return matchesSize && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-result">Aucun article trouvé 😕</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div class="item-info">
                        <h3>#${item.id} - ${item.name}</h3>
                        <div class="item-meta">
                            <span class="badge">Taille ${item.taille}</span>
                            <span class="badge">${item.etat}</span>
                        </div>
                        <div class="item-price">${item.prix} €</div>
                    </div>
                    <button class="add-btn" onclick="addToCart('${item.id}')">Ajouter</button>
                `;
                container.appendChild(card);
            });
        }

        function setFilter(size, element) {
            currentSize = size;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderCatalog(document.getElementById('search-input').value);
        }

        function filterCatalog() {
            renderCatalog(document.getElementById('search-input').value);
        }

        function addToCart(itemId) {
            cart.push(itemId);
            updateCartUI();
            
            // Petit retour haptique si supporté par Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            if (cart.length === 0) {
                closeCartModal();
            }
        }

        function updateCartUI() {
            const footerBar = document.getElementById("footer-cart-bar");
            if (cart.length > 0) {
                footerBar.style.display = "block";
                document.getElementById("cart-count-label").textContent = `🛒 ${cart.length} article(s)`;
                
                let calculations = calculateTotals();
                document.getElementById("cart-total-preview").textContent = `${calculations.finalTotal} € ➔ Panier`;
            } else {
                footerBar.style.display = "none";
            }
        }

        function calculateTotals() {
            let subtotal = 0;
            cart.forEach(id => {
                let item = items.find(i => i.id === id);
                if (item) subtotal += item.prix;
            });

            // Règle de remise : -5€ par article supplémentaire dès 70€ d'achat par article (ou appliqué globalement selon ta règle)
            let discount = 0;
            cart.forEach(id => {
                let item = items.find(i => i.id === id);
                if (item && item.prix >= 70) {
                    discount += 5; 
                }
            });

            let shipping = (subtotal - discount >= 170) ? 0 : 10;
            let finalTotal = subtotal - discount + shipping;
            if (finalTotal < 0) finalTotal = 0;

            return { subtotal, discount, shipping, finalTotal };
        }

        function openCartModal() {
            const listEl = document.getElementById("cartItemsList");
            listEl.innerHTML = "";

            cart.forEach((id, index) => {
                let item = items.find(i => i.id === id);
                if (item) {
                    const row = document.createElement("div");
                    row.className = "cart-item-row";
                    row.innerHTML = `
                        <span>#${item.id} - ${item.name} (${item.taille})</span>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <strong>${item.prix} €</strong>
                            <button class="remove-item" onclick="removeFromCart(${index})">&times;</button>
                        </div>
                    `;
                    listEl.appendChild(row);
                }
            });

            let calc = calculateTotals();
            document.getElementById("subtotalAmount").textContent = calc.subtotal + " €";
            document.getElementById("discountAmount").textContent = "-" + calc.discount + " €";
            document.getElementById("shippingAmount").textContent = calc.shipping === 0 ? "Offert 🎉" : calc.shipping + " €";
            document.getElementById("finalTotalAmount").textContent = calc.finalTotal + " €";

            document.getElementById("cartModal").style.display = "flex";
        }

        function closeCartModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        function sendOrderToBot() {
            if (cart.length === 0) return;
            // Envoie la liste des IDs au bot (ex: "1,3,5")
            tg.sendData(cart.join(','));
            tg.close();
        }

        renderCatalog();
    </script>
</body>
</html>
